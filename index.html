<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rxcoder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --near-white: #fafafa;
      --text-primary: #1a1a1a;
      --text-light: #9a9a9a;
      --text-ultra-light: #c8c8c8;
      --accent: #d0d0d0;
      --cursor: #1a1a1a;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      padding: 0 24px;
    }

    /* Eyebrow label */
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-ultra-light);
      opacity: 0;
      animation: rise 0.8s ease forwards 0.2s;
    }

    /* Main wordmark */
    .wordmark {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(56px, 12vw, 120px);
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.45s;
      position: relative;
      display: inline-block;
    }

    /* Blinking cursor after wordmark */
    .wordmark::after {
      content: '_';
      font-weight: 200;
      color: var(--text-ultra-light);
      animation: blink 1.1s step-end infinite;
      margin-left: 2px;
    }

    /* Tagline */
    .tagline {
      font-weight: 300;
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.04em;
      color: var(--text-light);
      max-width: 360px;
      line-height: 1.7;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.75s;
    }

    /* Divider */
    .divider {
      width: 32px;
      height: 1px;
      background: var(--accent);
      opacity: 0;
      animation: rise 0.6s ease forwards 1s;
    }

    /* Status pill */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-ultra-light);
      letter-spacing: 0.12em;
      opacity: 0;
      animation: rise 0.7s ease forwards 1.2s;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c5e8c5;
      box-shadow: 0 0 0 2px #e8f5e8;
      animation: pulse 2.4s ease-in-out infinite;
    }

    /* Animations */
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px #e8f5e8; }
      50%       { box-shadow: 0 0 0 5px #d4f0d4; }
    }

    /* Contact */
    .contact {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-ultra-light);
      letter-spacing: 0.12em;
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
      opacity: 0;
      animation: rise 0.7s ease forwards 1.45s;
    }

    .contact:hover {
      color: var(--text-light);
      border-color: var(--text-light);
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 28px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-ultra-light);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 1;
      opacity: 0;
      animation: rise 0.6s ease forwards 1.6s;
    }

    @media (max-width: 480px) {
      .tagline { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <main class="stage" role="main">
    <span class="eyebrow">est. 2026</span>
    <h1 class="wordmark">rxcoder</h1>
    <div class="divider"></div>
    <p class="tagline">crafting clean code &amp; thoughtful digital experiences</p>
    <div class="status">
      <span class="status-dot"></span>
      available for projects
    </div>
    <a class="contact" href="mailto:rahukp784@gmail.com">rahukp784@gmail.com</a>
  </main>

  <footer>© 2026 rxcoder</footer>

</body>
</html>
